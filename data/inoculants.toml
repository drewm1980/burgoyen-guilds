# Mycorrhizal inoculants — Cohousing Bourgoyen food forest
#
# Two types of entry:
#   pre_inoculated_tree  — nursery sells trees already inoculated at roots
#   diy_inoculant        — product applied by the buyer to their own nursery stock
#
# IMPORTANT CAVEATS (from research, April 2026):
#   - True Boletus edulis (cep/king bolete) and Cantharellus cibarius (golden
#     chanterelle) inoculated trees are extremely rare commercially. The
#     ectomycorrhizal partnerships cannot be axenically cultivated like
#     saprophytic mushrooms, making reliable mass production very difficult.
#   - The most commercially mature sector is truffle-inoculated trees
#     (Tuber melanosporum = Périgord black truffle; T. uncinatum/aestivum =
#     Burgundy truffle). Burgundy truffle is the climate-appropriate choice for
#     Ghent (zone 8a); Périgord requires warmer, drier conditions.
#   - For Ghent, best host trees are Quercus robur/petraea, Betula spp.,
#     Fagus sylvatica, Pinus sylvestris. Mediterranean species (cork oak,
#     holm oak) are marginal or unsuitable.
#   - First fruiting typically 3–10 years after planting, not guaranteed.
#   - DIY inoculants are often the more practical approach: buy standard
#     young trees from any nursery, apply inoculum at planting.

