# Rootstock database — Cohousing Bourgoyen food forest
#
# Enum values:
#   vigor: dwarfing | semi_dwarfing | semi_vigorous | vigorous | very_vigorous
#   anchorage: poor | moderate | good | excellent
#
# compatible_species: list of species.id values this rootstock supports
#
# grafted_height_m: approximate mature height of a standard scion grafted onto
#                   this rootstock, under good conditions

# ===========================================================================
# APPLE (Malus domestica) — East Malling / Long Ashton series
# ===========================================================================

[[rootstock]]
id = "m27"
name = "M27"
also_known_as = []
origin = "East Malling Research Station, UK"
compatible_species = ["malus_domestica"]
vigor = "dwarfing"
grafted_height_m = 1.5
anchorage = "poor"
requires_staking = true
soil_tolerance = "Needs deep, fertile, well-drained soil; struggles in light or poor soil"
disease_notes = "Susceptible to woolly aphid"
propagation = "stoolbed (layering)"
notes = "Extremely dwarfing; useful for containers or very intensive systems. Rarely sold as rootstock alone."

[[rootstock]]
